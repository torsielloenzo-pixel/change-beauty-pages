name: Ch’ange Pro — orientation PWA
on:
  push:
    paths:
      - 'pro-preview/orientation.js'
      - 'pro-preview/orientation.css'
      - 'pro-preview/tests/**'
      - '.github/workflows/change-pro-orientation-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  orientation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la syntaxe JavaScript
        run: node --check pro-preview/orientation.js
      - name: Vérifier l'orientation (0, 90, 180, 270)
        run: node --test pro-preview/tests/orientation.test.cjs
