name: CH'ANGE — Design public
on:
  push:
    paths:
      - 'design-public.js'
      - 'design-public.css'
      - 'home-reference.css'
      - 'home-canvas.css'
      - 'home-canvas.js'
      - 'first-screen-fluid.css'
      - 'header-editorial.css'
      - 'universe-identity.css'
      - 'home-editorial-polish.css'
      - 'home-menu-position.css'
      - 'home-beauty-collision.js'
      - 'home-beauty-collision.css'
      - 'tests/home-beauty-collision.test.cjs'
      - 'public-design-system.css'
      - 'universe-detail-parity.css'
      - 'esthetique-first-visit.css'
      - 'tests/esthetique-first-visit.test.cjs'
      - 'tests/universe-detail-parity.test.cjs'
      - 'tests/public-design-system.test.cjs'
      - 'tests/home-editorial-polish.test.cjs'
      - 'tests/universe-identity.test.cjs'
      - 'tests/header-editorial.test.cjs'
      - 'tests/first-screen-fluid.test.cjs'
      - 'official-public-header.css'
      - 'tests/official-public-header.test.cjs'
      - 'header-brand.js'
      - 'header-brand.css'
      - 'tests/header-brand.test.cjs'
      - 'tests/home-canvas.test.cjs'
      - 'tests/three-universes.test.cjs'
      - 'tests/aesthetic-parity.test.cjs'
      - 'tests/scene-superposition.test.cjs'
      - 'scene-superposition.css'
      - 'site-dynamic.js'
      - 'index.html'
      - '.github/workflows/change-design-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier les scripts du design public
        run: |
          node --check design-public.js
          node --check site-dynamic.js
          node --check home-canvas.js
          node --check home-beauty-collision.js
          node --check header-brand.js
          node --test tests/header-brand.test.cjs
          node --test tests/official-public-header.test.cjs
          node --test tests/home-canvas.test.cjs
          node --test tests/home-beauty-collision.test.cjs
          node --test tests/three-universes.test.cjs
          node --test tests/aesthetic-parity.test.cjs
          node --test tests/scene-superposition.test.cjs
          node --test tests/first-screen-fluid.test.cjs
          node --test tests/header-editorial.test.cjs
          node --test tests/universe-identity.test.cjs
          node --test tests/home-editorial-polish.test.cjs
          node --test tests/public-design-system.test.cjs
          node --test tests/universe-detail-parity.test.cjs
          node --test tests/esthetique-first-visit.test.cjs
      - name: Vérifier les ressources de l'accueil
        run: |
          test -s design-public.css
          test -s home-reference.css
          test -s home-canvas.css
          test -s home-menu-position.css
          test -s home-beauty-collision.js
          test -s home-beauty-collision.css
          grep -q 'home-beauty-collision.js' index.html
          grep -q 'home-beauty-collision.css' index.html
          test -s scene-superposition.css
          test -s header-brand.css
          test -s official-public-header.css
          test -s esthetique-first-visit.css
          grep -q 'esthetique-first-visit.css' index.html
          grep -q 'official-public-header.css' index.html
          grep -q 'header-brand.js' index.html
          grep -q 'header-brand.css' index.html
          grep -q 'home-reference.css' index.html
          grep -q 'home-menu-position.css' index.html
          grep -q 'dual-home__center' index.html
          grep -q 'dual-home__services' index.html
          grep -q 'change-home-layout' index.html
          grep -q 'renderScene(page)' design-public.js
          grep -q 'page-esthetique' home-canvas.css
          grep -q 'page-coiffure' home-canvas.css
          grep -q 'design-public.js' index.html
          grep -q 'design-public.css' index.html
          grep -q 'CHANGE_DESIGN_PUBLIC?.apply' site-dynamic.js
